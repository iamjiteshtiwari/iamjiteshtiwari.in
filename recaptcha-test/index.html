<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>reCAPTCHA v2 Test</title>

  <script
    src="https://www.google.com/recaptcha/api.js"
    async
    defer>
  </script>
</head>

<body>

  <h1>reCAPTCHA v2 Test</h1>

  <form id="test-form">

    <p>
      <label>
        Name<br>
        <input
          type="text"
          name="name"
          value="reCAPTCHA Test"
          required>
      </label>
    </p>

    <p>
      <label>
        Email<br>
        <input
          type="email"
          name="email"
          value="recaptcha-test@example.com"
          required>
      </label>
    </p>

    <p>
      <label>
        Mobile<br>
        <input
          type="text"
          name="mobile"
          value="+919876543210">
      </label>
    </p>

    <p>
      <label>
        Subject<br>
        <input
          type="text"
          name="subject"
          value="reCAPTCHA Domain Test"
          required>
      </label>
    </p>

    <p>
      <label>
        Message<br>
        <textarea
          name="message"
          required>Testing reCAPTCHA v2 on iamjiteshtiwari.in.</textarea>
      </label>
    </p>

    <div
      class="g-recaptcha"
      data-sitekey="6LcZbtEtAAAAAM793wZ-nmUR9VVy3WxOCXApqdQP">
    </div>

    <p>
      <button type="submit">
        Send Test
      </button>
    </p>

  </form>

  <pre id="result"></pre>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwKj3mrZPxfggC4W2953eRYeFLBvtIRR_j4mWF1nYLEwXlZM_IZBmESPv4WBvLgpuJ49Q/exec";

    const form = document.getElementById("test-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      result.textContent = "Sending...";

      const formData = new FormData(form);
      const body = new URLSearchParams();

      for (const [key, value] of formData.entries()) {
        body.append(key, value);
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: body.toString()
        });

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);

        if (data.success) {
          grecaptcha.reset();
        }
      } catch (error) {
        result.textContent =
          "Request failed:\n" + error.message;
      }
    });
  </script>

</body>
</html>
